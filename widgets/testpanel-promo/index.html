<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .tp-card {
    --accent-start: #F7941D;
    --accent-end: #EF4B36;
    --gradient: linear-gradient(135deg, var(--accent-start), var(--accent-end));
    font-family: var(--config--main-font-family, Arial, sans-serif);
    background: #ffffff;
    border-radius: 8px;
    overflow: hidden;
    color: #1A1A1A;
  }

  .tp-image-wrap {
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #0F0F0F;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .tp-image {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .tp-image-placeholder {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.3);
    font-size: 11px;
  }

  .tp-image-placeholder svg {
    opacity: 0.3;
  }

  .tp-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--gradient);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 9px;
    border-radius: 20px;
  }

  .tp-body {
    padding: 16px;
  }

  .tp-title {
    font-size: 15px;
    font-weight: 700;
    color: #0F0F0F;
    line-height: 1.25;
    margin-bottom: 8px;
  }

  .tp-desc {
    font-size: 12px;
    color: #555;
    line-height: 1.55;
    margin-bottom: 16px;
  }

  .tp-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    width: 100%;
    justify-content: center;
    padding: 10px 16px;
    background: var(--gradient);
    color: #fff;
    border: none;
    border-radius: 24px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    text-decoration: none;
    transition: opacity 0.2s;
  }

  .tp-btn:hover { opacity: 0.88; }

  .tp-btn svg {
    flex-shrink: 0;
  }
</style>

<div class="tp-card" id="tp-card">
  <div class="tp-image-wrap">
    <img class="tp-image" id="tp-image" src="" alt="" style="display:none">
    <div class="tp-image-placeholder" id="tp-placeholder">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      <span>Geen afbeelding</span>
    </div>
    <div class="tp-badge">Testpanel</div>
  </div>
  <div class="tp-body">
    <div class="tp-title" id="tp-title">Test ons nieuwste product</div>
    <div class="tp-desc" id="tp-desc">Doe mee aan ons testpanel en wees de eerste die ons nieuwste product uitprobeert. Jouw feedback helpt ons het te verbeteren.</div>
    <a class="tp-btn" id="tp-btn" href="#" target="_blank">
      <span id="tp-btn-label">Meld je aan</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>
</div>

<script type="module" src="app.js"></script>
