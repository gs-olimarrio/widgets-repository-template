<meta charset="utf-8">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  .tc-wrap {
    font-family: var(--config--main-font-family, Arial, sans-serif);
    color: #1A1A1A;
  }

  .tc-grid {
    display: grid;
    grid-template-columns: repeat(var(--cols, 4), 1fr);
    gap: 16px;
    margin-bottom: 20px;
  }

  .tc-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08), 0 0 0 1px rgba(0,0,0,0.05);
    padding: 16px;
    text-decoration: none;
    color: inherit;
    display: flex;
    flex-direction: column;
    position: relative;
    transition: box-shadow 0.2s, transform 0.2s;
    cursor: pointer;
  }

  .tc-card:hover {
    box-shadow: 0 4px 16px rgba(0,0,0,0.12), 0 0 0 1px rgba(0,0,0,0.07);
    transform: translateY(-2px);
  }

  .tc-card.hidden { display: none; }

  .tc-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    overflow: hidden;
    background: #f0f0f0;
    flex-shrink: 0;
  }

  .tc-badge img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .tc-image-wrap {
    width: 100%;
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 14px;
    overflow: hidden;
  }

  .tc-image {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .tc-image-placeholder {
    color: #ccc;
  }

  .tc-title {
    font-size: 15px;
    font-weight: 700;
    color: #0F0F0F;
    line-height: 1.2;
    margin-bottom: 4px;
  }

  .tc-meta {
    font-size: 12px;
    color: #888;
  }

  .tc-footer {
    text-align: center;
  }

  .tc-show-all {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: none;
    border: none;
    font-size: 14px;
    font-weight: 600;
    color: #EF4B36;
    cursor: pointer;
    padding: 4px 8px;
    transition: color 0.2s;
  }

  .tc-show-all:hover { color: #F7941D; }

  .tc-show-all.expanded .tc-chevron { transform: rotate(180deg); }

  .tc-chevron {
    transition: transform 0.25s ease;
    display: inline-block;
  }
</style>

<div class="tc-wrap" id="tc-wrap">
  <div class="tc-grid" id="tc-grid"></div>
  <div class="tc-footer" id="tc-footer" style="display:none">
    <button class="tc-show-all" id="tc-show-all">
      <span id="tc-show-all-label">Toon alles</span>
      <span class="tc-chevron">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
      </span>
    </button>
  </div>
</div>

<script type="module" src="app.js"></script>
